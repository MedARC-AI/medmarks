[project]
name = "mentalhealthbench"
description = "OpenAI MentalHealthBench evaluation by Malik et al., 2026"
tags = ["medical", "mental-health", "multi-turn", "llm-judge"]
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "medarc-verifiers>=0.1.0",
    "verifiers>=0.1.12,<0.2",
    "datasets>=4.1.1",
    "openai>=2.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.verifiers.eval]
num_examples = -1
rollouts_per_example = 1

[tool.prime.environment]
loader = "mentalhealthbench:load_environment"
display_name = "MentalHealthBench"
visibility = "PUBLIC"
