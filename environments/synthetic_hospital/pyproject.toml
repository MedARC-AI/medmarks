[project]
name = "synthetic-hospital"
version = "0.2.0"
description = "Synthetic Hospital v1.3: five clinical tasks with deterministic scoring"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
dependencies = ["verifiers>=0.1.14,<0.2", "datasets>=4,<5", "numpy>=1.26", "rouge-score>=0.1.2"]

[project.scripts]
synthetic-hospital-score = "synthetic_hospital.aggregate:main"

[tool.prime.environment]
loader = "synthetic_hospital:load_environment"
display_name = "Synthetic Hospital"
visibility = "PUBLIC"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["synthetic_hospital"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
